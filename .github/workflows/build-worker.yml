name: Build and Push MiniMax-H3 RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for CUDA/PyTorch layers
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minimax-h3-worker:latest
            ghcr.io/${{ github.repository_owner }}/minimax-h3-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
