[project]
name = "runpod-minimax-h3"
version = "0.1.0"
description = "Headless RunPod Serverless worker and multi-scene orchestrator for MiniMax-H3 (MATLOWAI Fused Turbo INT8 ConvRot)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
minimax-h3 = "client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client", "worker", "scripts"]
